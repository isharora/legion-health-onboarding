<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="An interactive Legion Health onboarding prototype with live provider matching." />
  <title>Legion Health · Find your care</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="scenario-controls" class="scenario-controls" aria-label="Prototype scenarios"><strong>Explore scenarios</strong><label>Location <select id="scenario-location"><option value="texas">In Texas</option><option value="outside">Outside Texas</option></select></label><label>Verified lookup <select id="scenario-verified"><option value="found">Found · $25 copay</option><option value="not-found">Not found · manual entry</option><option value="benefits-pending">Found · cost pending</option></select></label><label>Records <select id="scenario-records"><option value="" selected>—</option><option value="checking">Checking now</option><option value="found">Some records found</option><option value="still">Still checking</option><option value="ready">Records + text answers ready</option></select></label><span class="scenario-divider" aria-hidden="true"></span><strong>Post-booking channels</strong><button class="secondary scenario-channel" data-scenario-intake="web">Web</button><button class="secondary scenario-channel" data-scenario-intake="text">Text</button><button class="secondary scenario-channel" data-scenario-intake="phone">Phone</button><a class="secondary spec-link" href="spec.html">Spec overview ↗</a><small>These controls preview alternate intake channels.</small></div>
  <header class="site-header"><a class="brand" href="index.html" aria-label="Legion Health home"><img class="brand-logo" src="assets/legion-logo.png" alt="Legion Health"></a><button id="restart" class="text-button">Start over</button></header>
  <main class="shell"><section class="journey" aria-label="Onboarding"><div id="mobile-preview"></div><div id="flow"></div></section><aside class="provider-pane" id="provider-pane" aria-label="Providers and availability"><div id="providers"></div></aside></main>
  <dialog id="info-dialog"><div class="dialog-content"><button class="dialog-close" aria-label="Close dialog">×</button><h2 id="dialog-title"></h2><div id="dialog-body"></div></div></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
